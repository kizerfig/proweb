<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="description" content="Detalle del Partido - Copa Mundial de la FIFA 2026. Cronología, alineaciones, estadísticas y highlights en vivo.">
 <title>Detalle de Partido - Copa Mundial de la FIFA 2026</title>


 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">


 <link rel="stylesheet" href="../css/main.css">
 <link rel="stylesheet" href="../css/components.css">
 <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

 <header id="site-header" class="site-header"></header>


 <main class="container section-padding" id="main-content">


 <div class="back-link-wrapper">
 <a href="partidos.html" class="back-link">&lsaquo; Volver al calendario</a>
 </div>


 <section class="match-hero-card" id="match-hero">
 <div class="skeleton" style="height: 260px; border-radius: var(--radius-lg);"></div>
 </section>


 <nav class="match-tabs" aria-label="Secciones de detalle del partido">
 <button class="tab-btn active" data-tab="cronologia">Cronología</button>
 <button class="tab-btn" data-tab="estadisticas">Estadísticas</button>
 <button class="tab-btn" data-tab="alineaciones">Alineaciones</button>
 <button class="tab-btn" data-tab="highlights">Highlights</button>
 </nav>


 <div class="tab-contents-container">


 <section class="tab-content active" id="tab-cronologia" aria-label="Cronología del partido">
 <div class="timeline-container" id="timeline-list">
 <div class="skeleton" style="height: 120px;"></div>
 </div>
 </section>


 <section class="tab-content" id="tab-estadisticas" aria-label="Estadísticas comparativas">
 <div class="stats-container" id="stats-list">
 <div class="skeleton" style="height: 200px;"></div>
 </div>
 </section>


 <section class="tab-content" id="tab-alineaciones" aria-label="Alineaciones de los equipos">
 <div class="lineups-container" id="lineups-view">
 <div class="skeleton" style="height: 350px;"></div>
 </div>
 </section>


 <section class="tab-content" id="tab-highlights" aria-label="Resumen y momentos destacados">
 <div class="highlights-container" id="highlights-view">
 <div class="skeleton" style="height: 300px;"></div>
 </div>
 </section>

 </div>

 </main>

 <footer id="site-footer" class="site-footer"></footer>


 <script type="module" src="../js/match-detail.js"></script>
</body>
</html>
