<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calendario de Partidos de la Copa Mundial de la FIFA 2026.">
  <title>Partidos - Copa Mundial de la FIFA 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Segoe+UI&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="container section-padding" id="main-content">
    <div class="section-header" style="margin-bottom: 1.5rem;">
      <h1 class="section-title" style="font-size: 2.2rem;">Calendario de Partidos</h1>
    </div>
    <form class="filter-bar" id="filter-form" onsubmit="event.preventDefault();">
      <select id="filter-city" class="filter-select" aria-label="Filtrar por ciudad">
        <option value="all">Todas las ciudades</option>
        <option value="Ciudad de México">Ciudad de México</option>
        <option value="Guadalajara">Guadalajara</option>
        <option value="Monterrey">Monterrey</option>
        <option value="Toronto">Toronto</option>
        <option value="Vancouver">Vancouver</option>
        <option value="Nueva York">Nueva York</option>
        <option value="Los Ángeles">Los Ángeles</option>
        <option value="Dallas">Dallas</option>
        <option value="Kansas City">Kansas City</option>
        <option value="Boston">Boston</option>
        <option value="Filadelfia">Filadelfia</option>
        <option value="Miami">Miami</option>
        <option value="Houston">Houston</option>
        <option value="Atlanta">Atlanta</option>
        <option value="Seattle">Seattle</option>
        <option value="San Francisco">San Francisco</option>
      </select>
      <select id="filter-round" class="filter-select" aria-label="Filtrar por ronda">
        <option value="all">Todas las rondas</option>
        <option value="Fase de Grupos">Fase de Grupos</option>
        <option value="Dieciseisavos">Dieciseisavos</option>
        <option value="Octavos">Octavos</option>
        <option value="Cuartos">Cuartos</option>
        <option value="Semifinal">Semifinal</option>
        <option value="Tercer Lugar">Tercer Lugar</option>
        <option value="Final">Final</option>
      </select>
      <select id="filter-status" class="filter-select" aria-label="Filtrar por estatus">
        <option value="all">Todos los estatus</option>
        <option value="Programado">Programado</option>
        <option value="En vivo">En vivo</option>
        <option value="Finalizado">Finalizado</option>
      </select>
      <select id="filter-group" class="filter-select" aria-label="Filtrar por grupo">
        <option value="all">Todos los grupos</option>
        <option value="Grupo A">Grupo A</option>
        <option value="Grupo B">Grupo B</option>
        <option value="Grupo C">Grupo C</option>
        <option value="Grupo D">Grupo D</option>
        <option value="Grupo E">Grupo E</option>
        <option value="Grupo F">Grupo F</option>
        <option value="Grupo G">Grupo G</option>
        <option value="Grupo H">Grupo H</option>
        <option value="Grupo I">Grupo I</option>
        <option value="Grupo J">Grupo J</option>
        <option value="Grupo K">Grupo K</option>
        <option value="Grupo L">Grupo L</option>
      </select>
      <input type="text" id="search-team" class="search-input" placeholder="Buscar equipo..." aria-label="Buscar equipo por nombre o código">
    </form>
    <div class="matches-grid-full" id="matches-grid-container">
      <div class="skeleton" style="height: 180px;"></div>
      <div class="skeleton" style="height: 180px;"></div>
      <div class="skeleton" style="height: 180px;"></div>
    </div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="js/matches.js"></script>
</body>
</html>
