<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="description" content="Calendario oficial de próximos torneos y eventos internacionales de la FIFA y confederaciones continentales (CONMEBOL, CONCACAF, UEFA).">
 <title>Próximos Torneos y Eventos - Copa Mundial de la FIFA 2026</title>

 <!-- Google Fonts for Modern Typography -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Segoe+UI&display=swap" rel="stylesheet">

 <!-- Native Stylesheets -->
 <link rel="stylesheet" href="../css/main.css">
 <link rel="stylesheet" href="../css/components.css">
 <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

 <header id="site-header" class="site-header"></header>

 <!-- ==========================================
 MAIN CONTENT - PRÓXIMOS TORNEOS Y EVENTOS
 ========================================== -->
 <main class="container section-padding" id="main-content">
 
 <!-- 1. Encabezado de Página -->
 <div class="page-title-section">
 <h1 class="page-title">Próximos Torneos y Eventos</h1>
 <p class="page-subtitle">Calendario de competiciones oficiales de la FIFA y confederaciones internacionales</p>
 </div>

 <!-- 2. Grid de Métricas / KPIs Superiores (.tournaments-stats) -->
 <section class="tournaments-stats" aria-label="Estadísticas resumidas de torneos">
 
 <div class="stat-card-kpi">
 <span class="kpi-num mint">6</span>
 <span class="kpi-label">Torneos Listados</span>
 </div>

 <div class="stat-card-kpi">
 <span class="kpi-num blue">177+</span>
 <span class="kpi-label">Equipos Participantes</span>
 </div>

 <div class="stat-card-kpi">
 <span class="kpi-num red">4</span>
 <span class="kpi-label">Próximas Ediciones</span>
 </div>

 <div class="stat-card-kpi">
 <span class="kpi-num gold">9</span>
 <span class="kpi-label">Países Sede</span>
 </div>

 </section>

 <!-- 3. Listado Dinámico de Tarjetas de Torneos (.tournament-card-list) -->
 <section class="tournament-card-list" id="tournaments-container" aria-label="Lista de competiciones internacionales">
 <!-- Skeletons loaded initially -->
 <div class="skeleton" style="height: 140px; border-radius: var(--radius-md);"></div>
 <div class="skeleton" style="height: 140px; border-radius: var(--radius-md);"></div>
 <div class="skeleton" style="height: 140px; border-radius: var(--radius-md);"></div>
 <div class="skeleton" style="height: 140px; border-radius: var(--radius-md);"></div>
 </section>

 </main>

 <footer id="site-footer" class="site-footer"></footer>

 <!-- Script Module -->
 <script type="module" src="../js/tournaments.js"></script>
</body>
</html>
