<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Archivo de Videos Históricos de la Copa Mundial de la FIFA. Revive las jugadas, goles y finales más memorables de la historia del fútbol.">
  <title>Videos Históricos - Copa Mundial de la FIFA 2026</title>

  <!-- Google Fonts for Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Segoe+UI&display=swap" rel="stylesheet">

  <!-- Native Stylesheets -->
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <header id="site-header" class="site-header"></header>

  <!-- ==========================================
       MAIN CONTENT - VIDEOS HISTÓRICOS
       ========================================== -->
  <main class="container section-padding" id="main-content">
    
    <!-- Encabezado de la página -->
    <div class="page-title-section">
      <h1 class="page-title">Videos Históricos</h1>
      <p class="page-subtitle">Revive los momentos más memorables de la historia de la Copa del Mundo</p>
    </div>

    <!-- Filtros de categoría por pestañas tipo píldora (.video-tabs) -->
    <nav class="video-tabs" aria-label="Filtrar videos por categoría">
      <button class="tab-btn active" data-category="all">Todos</button>
      <button class="tab-btn" data-category="Momentos Históricos">Momentos Históricos</button>
      <button class="tab-btn" data-category="Finales Memorables">Finales Memorables</button>
      <button class="tab-btn" data-category="Leyendas">Leyendas</button>
    </nav>

    <!-- Lista Vertical de Videos (.videos-list) -->
    <section class="videos-list" id="videos-container" aria-label="Listado de videos históricos">
      <!-- Skeletons loaded initially -->
      <div class="skeleton" style="height: 120px; border-radius: var(--radius-md);"></div>
      <div class="skeleton" style="height: 120px; border-radius: var(--radius-md);"></div>
      <div class="skeleton" style="height: 120px; border-radius: var(--radius-md);"></div>
      <div class="skeleton" style="height: 120px; border-radius: var(--radius-md);"></div>
    </section>

  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <!-- Script Module -->
  <script type="module" src="../js/videos.js"></script>
</body>
</html>
