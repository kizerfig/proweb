<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="description" content="Tabla de Clasificación y Fases de la Copa Mundial de la FIFA 2026. Posiciones por grupo, puntos, partidos jugados y llaves eliminatorias.">
 <title>Clasificación y Fases - Copa Mundial de la FIFA 2026</title>

 <!-- Google Fonts for Modern Typography -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

 <!-- Native Stylesheets -->
 <link rel="stylesheet" href="../css/main.css">
 <link rel="stylesheet" href="../css/components.css">
 <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

 <header id="site-header" class="site-header"></header>

 <!-- ==========================================
 MAIN CONTENT - CLASIFICACIÓN Y FASES
 ========================================== -->
 <main class="container section-padding" id="main-content">
 
 <div class="section-header" style="margin-bottom: 1.5rem;">
 <h1 class="section-title" style="font-size: 2.2rem;"> Clasificación y Fases</h1>
 </div>

 <!-- Filter & Phase Tabs -->
 <div class="filter-bar" style="margin-bottom: 1.5rem;">
 <div class="tab-group" role="tablist" aria-label="Pestañas de fase">
 <button class="tab-btn active" role="tab" aria-selected="true" data-tab="all">Todos los Grupos</button>
 <button class="tab-btn" role="tab" aria-selected="false" data-tab="by-group">Por Grupo</button>
 <button class="tab-btn" role="tab" aria-selected="false" data-tab="knockout"> Eliminatorias</button>
 </div>

 <!-- Individual Group Selector (Hidden by default, shown on 'by-group') -->
 <div id="group-selector-wrap" style="display: none; flex: 1 1 200px;">
 <select id="single-group-select" class="filter-select" aria-label="Seleccionar grupo específico">
 <option value="A">Grupo A</option>
 <option value="B">Grupo B</option>
 <option value="C">Grupo C</option>
 <option value="D">Grupo D</option>
 <option value="E">Grupo E</option>
 <option value="F">Grupo F</option>
 </select>
 </div>
 </div>

 <!-- Group Cards Grid Container -->
 <div class="group-grid" id="group-grid-container">
 <!-- Skeleton Loaders initially -->
 <div class="skeleton" style="height: 240px;"></div>
 <div class="skeleton" style="height: 240px;"></div>
 <div class="skeleton" style="height: 240px;"></div>
 <div class="skeleton" style="height: 240px;"></div>
 <div class="skeleton" style="height: 240px;"></div>
 <div class="skeleton" style="height: 240px;"></div>
 </div>

 </main>

 <footer id="site-footer" class="site-footer"></footer>

 <!-- Standings Entry JavaScript Module -->
 <script type="module" src="../js/standings.js"></script>
</body>
</html>
