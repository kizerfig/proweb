<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalle de video - Copa Mundial de la FIFA 2026.">
  <title>Detalle de Video - Copa Mundial de la FIFA 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Segoe+UI&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="inicio">
  <header id="site-header" class="site-header"></header>
  <main class="container section-padding content-page" id="main-content">
    <a href="archivos.html" class="section-link">&larr; Volver al archivo</a>
    <h1 class="section-title" style="font-size: 2.2rem; margin: 1rem 0 1.5rem;">Detalle del Video</h1>
    <div class="detail-card info-card">
      <p id="video-title"><strong>Título:</strong> Cargando...</p>
      <p id="video-desc"><strong>Descripción:</strong> Cargando...</p>
    </div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module">
    import { initLayout, getQueryParam } from './js/layout.js';

    const videos = {
      '1': { title: 'Mejores goles del Mundial 2022', desc: 'Compilación de los goles más destacados del torneo en Qatar.' },
      '2': { title: 'Historia de las finales mundialistas', desc: 'Documental con momentos icónicos de finales históricas.' },
      '3': { title: 'Preparación rumbo al 2026', desc: 'Cobertura de entrenamientos y declaraciones previas al torneo.' }
    };

    document.addEventListener('DOMContentLoaded', () => {
      initLayout('inicio');
      const id = getQueryParam('id');
      const video = videos[id];
      document.getElementById('video-title').innerHTML = `<strong>Título:</strong> ${video?.title || 'Video no encontrado'}`;
      document.getElementById('video-desc').innerHTML = `<strong>Descripción:</strong> ${video?.desc || 'No hay información disponible.'}`;
    });
  </script>
</body>
</html>
