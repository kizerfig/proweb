<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ciudades Anfitrionas y Estadios Oficiales de la Copa Mundial de la FIFA 2026 - Estados Unidos, México y Canadá.">
  <title>Ciudades Anfitrionas - Copa Mundial de la FIFA 2026</title>

  <!-- Google Fonts for Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Native Stylesheets -->
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <header id="site-header" class="site-header"></header>

  <!-- ==========================================
       MAIN CONTENT - CIUDADES ANFITRIONAS
       ========================================== -->
  <main class="container section-padding" id="main-content">
    
    <div class="section-header" style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h1 class="section-title" style="font-size: 2.2rem; margin-bottom: 0.25rem; color: #F0F6FC;">Ciudades Anfitrionas</h1>
        <p style="color: var(--text-secondary); font-size: 0.95rem;">Las 16 sedes oficiales de Estados Unidos, México y Canadá</p>
      </div>

      <!-- Filter by Country Dropdown -->
      <div>
        <select id="filter-country" class="filter-select" aria-label="Filtrar por país">
          <option value="all">Todos los países</option>
          <option value="Estados Unidos">Estados Unidos</option>
          <option value="México">México</option>
          <option value="Canadá">Canadá</option>
        </select>
      </div>
    </div>

    <!-- Cities Grid Container -->
    <div class="cities-grid" id="cities-grid-container">
      <div class="skeleton" style="height: 320px; border-radius: var(--radius-lg);"></div>
      <div class="skeleton" style="height: 320px; border-radius: var(--radius-lg);"></div>
      <div class="skeleton" style="height: 320px; border-radius: var(--radius-lg);"></div>
      <div class="skeleton" style="height: 320px; border-radius: var(--radius-lg);"></div>
      <div class="skeleton" style="height: 320px; border-radius: var(--radius-lg);"></div>
      <div class="skeleton" style="height: 320px; border-radius: var(--radius-lg);"></div>
      <div class="skeleton" style="height: 320px; border-radius: var(--radius-lg);"></div>
      <div class="skeleton" style="height: 320px; border-radius: var(--radius-lg);"></div>
    </div>

  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <!-- Script module -->
  <script type="module" src="../js/cities.js"></script>
</body>
</html>
