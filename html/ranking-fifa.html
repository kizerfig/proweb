<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="description" content="Ranking FIFA Mundial Oficial - Clasificación oficial de selecciones nacionales de fútbol.">
 <title>Ranking FIFA Mundial - Copa Mundial de la FIFA 2026</title>

 <!-- Google Fonts for Modern Typography -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

 <!-- Native Stylesheets -->
 <link rel="stylesheet" href="../css/main.css">
 <link rel="stylesheet" href="../css/components.css">
 <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

 <header id="site-header" class="site-header"></header>

 <!-- ==========================================
 MAIN CONTENT - RANKING FIFA DEDICADO
 ========================================== -->
 <main class="container section-padding" id="main-content">
 
 <div style="margin-bottom: 2rem;">
 <h1 class="section-title" style="font-size: 2.2rem; margin-bottom: 0.35rem;">Ranking FIFA Mundial</h1>
 <p style="color: var(--text-secondary); font-size: 0.95rem;">Clasificación oficial de selecciones nacionales según el sistema de puntos FIFA</p>
 </div>

 <!-- Filter Bar -->
 <div class="filter-bar" style="margin-bottom: 2rem;">
 <div class="tab-group" role="tablist">
 <button class="tab-btn active" id="btn-by-rank">Por Posición</button>
 <button class="tab-btn" id="btn-by-conf">Por Confederación</button>
 </div>

 <div style="flex: 1 1 200px;">
 <select id="conf-select" class="filter-select" aria-label="Filtrar por confederación">
 <option value="all">Todas las confederaciones</option>
 <option value="CONMEBOL">CONMEBOL</option>
 <option value="UEFA">UEFA</option>
 <option value="CONCACAF">CONCACAF</option>
 <option value="CAF">CAF</option>
 <option value="AFC">AFC</option>
 </select>
 </div>
 </div>

 <!-- Podium Top 3 Cards -->
 <div class="podium-grid" id="podium-container">
 <div class="skeleton" style="height: 140px;"></div>
 <div class="skeleton" style="height: 170px;"></div>
 <div class="skeleton" style="height: 140px;"></div>
 </div>

 <!-- Ranking Table Container -->
 <div class="group-card" style="padding: 0; overflow: hidden;">
 <div class="group-card-header" style="background: linear-gradient(135deg, #161B22, #21262D); color: var(--text-primary); border-bottom: 1px solid var(--border-color);">
 <span> Tabla General de Posiciones FIFA</span>
 </div>

 <div style="overflow-x: auto;">
 <table class="group-table" id="ranking-table">
 <thead>
 <tr>
 <th style="width: 50px; text-align: center;">#</th>
 <th>Selección</th>
 <th style="text-align: center;">Confederación</th>
 <th style="text-align: center;">Ranking FIFA</th>
 <th style="text-align: center;">Mundiales</th>
 <th>DT</th>
 </tr>
 </thead>
 <tbody id="ranking-table-body">
 <!-- Table rows populated dynamically -->
 </tbody>
 </table>
 </div>
 </div>

 </main>

 <footer id="site-footer" class="site-footer"></footer>

 <!-- Script module -->
 <script type="module" src="../js/ranking.js"></script>
</body>
</html>
